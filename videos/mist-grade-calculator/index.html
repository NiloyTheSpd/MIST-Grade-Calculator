<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #050a30;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* Sub-comp slots stretch to fill the root. */
      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-8ksb"
      id="root"
      data-composition-id="main"
      data-width="1920"
      data-height="1080"
      data-duration="30"
      data-fps="60"
    >
      <div data-hf-id="hf-g9cw"
        id="el-ink-band"
        data-composition-id="01-ink-band"
        data-composition-src="compositions/frames/01-ink-band.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div data-hf-id="hf-3ooj"
        id="el-the-sheet"
        data-composition-id="02-the-sheet"
        data-composition-src="compositions/frames/02-the-sheet.html"
        data-start="3"
        data-duration="3.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div data-hf-id="hf-ylg1"
        id="el-six-fields"
        data-composition-id="03-six-fields"
        data-composition-src="compositions/frames/03-six-fields.html"
        data-start="6.5"
        data-duration="6.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div data-hf-id="hf-8wv1"
        id="el-the-answer"
        data-composition-id="04-the-answer"
        data-composition-src="compositions/frames/04-the-answer.html"
        data-start="13"
        data-duration="4"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div data-hf-id="hf-yopx"
        id="el-the-rules"
        data-composition-id="05-the-rules"
        data-composition-src="compositions/frames/05-the-rules.html"
        data-start="17"
        data-duration="4.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div data-hf-id="hf-aslr"
        id="el-the-ladder"
        data-composition-id="06-the-ladder"
        data-composition-src="compositions/frames/06-the-ladder.html"
        data-start="21.5"
        data-duration="3.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div data-hf-id="hf-h5b1"
        id="el-end-card"
        data-composition-id="07-end-card"
        data-composition-src="compositions/frames/07-end-card.html"
        data-start="25"
        data-duration="5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- The music bed. It is on its own track so it runs under every
           frame, and it starts at zero with the film. -->
      <audio
        id="el-bgm"
        data-hf-id="hf-bgm"
        data-start="0"
        data-duration="30"
        data-track-index="10"
        src="assets/bgm/track.wav"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
