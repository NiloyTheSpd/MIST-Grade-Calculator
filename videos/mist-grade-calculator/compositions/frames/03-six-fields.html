        /* The camera: the whole ledger sits inside it, so the frame's

        /* The six rows, rebuilt live as the site's own ledger: a label on
           the left, a boxed field on the right, a hairline between each.
           The site's plate is the reference; the type is rebuilt so it stays

        #root .rows {

        /* The ledger's own rules draw themselves in, left to right. The

      <script>
        (() => {
          const camera = document.getElementById("s03-camera");
          const figure = document.getElementById("s03-figure");
          const required = document.getElementById("s03-required");
          const cursor = document.getElementById("s03-cursor");
          const fill = document.getElementById("s03-fill");
          const burst = document.getElementById("s03-burst");
          const rows = Array.from(document.querySelectorAll("#s03-scene .row"));
          const labels = rows.map((r) => r.querySelector(".row__label"));
          const rules = rows.map((r) => r.querySelector(".row__rule"));
          const fields = rows.map((r) => r.querySelector(".row__field"));

          /* The film's frame rate is 60, so every frame-based timing below
             is written as N / 60 seconds. */
          const F = 1 / 60;

          /* The six rows sit on the ledger's grid: 106px each, starting
             344px down. The field column ends at x=1800, so the cursor
             at x=1808 stays clear of every digit it fills. */
          const ROW_TOP = 344;
          const ROW_H = 106;
          const FIELD_RIGHT = 1800;
          const CLICK_X = 1822;

          /* The per-row carets and click ripples are built once, here, and
             live in the DOM from t=0. Nothing is created mid-flight: a
             seek to any time finds the same DOM the renderer found at
             t=0. */
          const carets = [];
          const ripples = [];
          rows.forEach((row, i) => {
            const rowTop = ROW_TOP + i * ROW_H;

            const caret = document.createElement("div");
            caret.className = "caret";
            caret.id = "s03-caret-" + i;
            caret.style.top = rowTop + 36 + "px";
            camera.appendChild(caret);
            carets.push(caret);

            /* Two rings per click: a tight one and a wider one a few
               frames behind it. */
            for (let r = 0; r < 2; r++) {
              const ring = document.createElement("div");
              ring.className = "ripple";
              ring.id = "s03-ripple-" + i + "-" + r;
              ring.style.left = CLICK_X + "px";
              ring.style.top = rowTop + 60 + "px";
              camera.appendChild(ring);
              ripples.push({ el: ring, row: i, ring: r });
            }
          });

          /* The particle pool. Twenty-eight chips, generated once from an
             index-seeded hash — no Math.random, no Date.now. The burst
             rule's ballistic writer drives a proxy from an onUpdate,
           which the host's suppressed seek never fires, so every chip is
             a direct property tween of its own instead: each one
             carries its own launch values and renders the correct
           mid-flight state at any seek. */
          const prand = (n) => {
            const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return x - Math.floor(x);
          };
          const PARTICLES = 28;
          const particles = [];
          for (let i = 0; i < PARTICLES; i++) {
            const el = document.createElement("div");
            el.className = "particle";
            el.id = "s03-particle-" + i;
            const size = 4 + prand(i * 3 + 1) * 2;
            el.style.width = size + "px";
            el.style.height = Math.round(size * 0.7) + "px";
            /* Paper chips. The band's lime top edge is the frame's one
               lime element; the burst stays paper. */
            el.style.backgroundColor = "#F2F5FF";
            burst.appendChild(el);

            /* A wide, shallow fan: the chips break off the number and
               scatter sideways, not straight up out of the frame. */
            const angle = -Math.PI / 2 + (prand(i * 5 + 2) * 2 - 1) * 2.1;
            const dist = 70 + prand(i * 7 + 3) * 110;
            particles.push({
              el,
              /* The origin is spread across the figure's own glyphs, so
                 the burst reads as the number coming apart. */
              x: (prand(i * 11 + 4) - 0.5) * 250,
              y: (prand(i * 13 + 5) - 0.5) * 90,
              dx: Math.cos(angle) * dist,
              dy: Math.sin(angle) * dist * 0.55,
              spin: (prand(i * 17 + 6) * 2 - 1) * 220,
            });
          }

          const tl = gsap.timeline({ paused: true });

          /* GSAP paints a fromTo's from-state the moment the tween is
             created. Stack several fromTo's on ONE element and the last
             one's from-state is left on screen until that tween starts —
             and because the host renders this composition by seeking with
             events suppressed, that stale paint is what the frame
             actually shows. The achieved figure read its own final total
             at t=0 for exactly this reason.

             So only the FIRST tween in each chain owns the initial state.
             Every later tween declares its from-values explicitly and
             never paints early. */
          const LATER = { immediateRender: false };

          /* A slow drift down the six rows over the frame. Every label
             stays in frame: this is the frame that has to be read, and the
             cursor and the caret carry the motion.

             The transform is tweened on the element itself, not through a
             callback: the host renders this composition by seeking its
             timeline with events suppressed, so onUpdate never fires. */
          tl.fromTo(
            camera,
            { scale: 1 },
            {
              scale: 1.04,
              duration: 6.5,
              ease: "power1.out",
            },
            0
          );

          /* The site's own scenario. Each mark lands in a field and the
             achieved figure climbs with it.

             Everything below is a tweened property, never a callback. The
             host renders this composition by seeking its timeline with
             events suppressed, so onStart, onUpdate and tl.call never fire
             on a seek: a frame built out of callbacks renders blank. GSAP
             still writes tweened values on a seek, so each number is a
             textContent tween and each change is a property tween. */
          const marks = [
            { value: "17", total: "25.50", required: 215 },
            { value: "15", total: "48.00", required: 192 },
            { value: "12", total: "48.00", required: 192 },
            { value: "12", total: "78.00", required: 162 },
            { value: "13", total: "91.50", required: 149 },
            { value: "24", total: "97.00", required: 143 }
          ];

          /* Each mark lands fifteen frames after the last, so the six land
             over the three seconds the frame spends on the rows. */
          const STEP = 30 * F;
          const START = 36 * F;
          /* The cursor reaches the field, the caret blinks, the number
             counts up, and the figure follows it. */
          const MOVE = 18 * F;
          const CARET = 18 * F;
          const COUNT = 22 * F;
          const CLIMB = 16 * F;

          /* Whole numbers, the way a mark is written. */
          const whole = {
            modifiers: {
              textContent: (value) => String(Math.round(parseFloat(value)))
            }
          };

          /* The marks still needed in the Final only ever show a figure
             the site itself states. A raw interpolation between two of
             them would sweep through values like 185 that the site never
             says, so the number snaps to the nearest stated figure the
             same way the achieved total snaps to the site's totals. */
          const REQUIRED_FIGURES = [215, 192, 162, 149, 143];
          const requiredSnap = {
            modifiers: {
              textContent: (value) => {
                const n = parseFloat(value);
                if (!Number.isFinite(n)) return value;
                let best = REQUIRED_FIGURES[0];
                let bestGap = Infinity;
                for (const r of REQUIRED_FIGURES) {
                  const gap = Math.abs(r - n);
                  if (gap < bestGap) {
                    bestGap = gap;
                    best = r;
                  }
                }
                return String(best);
              }
            }
          };

          /* The achieved figure keeps the two places the site's own
             figures row shows, and it only ever shows a total the site
             itself states. A raw interpolation would sweep through
             figures like 55.03 that the site never says, so the value
             snaps to the nearest of the site's own totals. */
          const totals = ["0.00", "25.50", "48.00", "78.00", "91.50", "97.00"];
          const cents = {
            modifiers: {
              textContent: (value) => {
                const n = parseFloat(value);
                if (!Number.isFinite(n)) return value;
                let best = totals[0];
                let bestGap = Infinity;
                for (const t of totals) {
                  const gap = Math.abs(parseFloat(t) - n);
                  if (gap < bestGap) {
                    bestGap = gap;
                    best = t;
                  }
                }
                return best;
              }
            }
          };

          /* ----------------------------------------------------------------
             The ledger opens: the six rules draw themselves in left to
             right, then the six labels whip up as a waterfall cascade.
             The rule's sample uses tl.set for the binary reveal; under a
             suppressed seek tl.set never fires, so the hidden state is
             baked into the CSS and the reveal is a one-frame opacity
             tween beside the y whip. The labels overlap by a couple of
             frames and each travels a little less than the one before.
             ---------------------------------------------------------------- */
          const LABEL_TRAVEL = [80, 66, 54, 46, 40, 34];
          const LABEL_DUR = [6 * F, 6 * F, 5 * F, 5 * F, 4 * F, 4 * F];
          const LABEL_START = [0, 3 * F, 6 * F, 9 * F, 12 * F, 15 * F];

          rules.forEach((rule, i) => {
            tl.fromTo(
              rule,
              { scaleX: 0 },
              { scaleX: 1, duration: 10 * F, ease: "power3.out" },
              i * 2 * F
            );
          });

          labels.forEach((label, i) => {
            /* The binary reveal: one frame from nothing to opaque, so
               the label snaps in and never fades on the way. */
            tl.fromTo(
              label,
              { opacity: 0 },
              { opacity: 1, duration: F, ease: "none" },
              LABEL_START[i]
            );
            /* The whip itself: up from below, hard landing. */
            tl.fromTo(
              label,
              { y: LABEL_TRAVEL[i] },
              { y: 0, duration: LABEL_DUR[i], ease: "power4.out" },
              LABEL_START[i]
            );
          });

          /* ----------------------------------------------------------------
             The cursor enters from off-frame and lands over the first
             field, tip pointing left at it. The arrow's tip is twelve
             pixels into its box, so the offset puts the tip just outside
             the field's right edge and clear of the digits.
             ---------------------------------------------------------------- */
          tl.fromTo(
            cursor,
            { opacity: 0, x: 2400, y: 200, scale: 0.4 },
            { opacity: 1, x: 1808, y: 400, scale: 1, duration: 12 * F, ease: "power3.out" },
            6 * F
          );

          let prevTotal = "0.00";
          let prevRequired = "215";
          let prevFill = 0;

          marks.forEach((mark, index) => {
            const at = START + index * STEP;
            const row = fields[index];
            const rowTop = ROW_TOP + index * ROW_H;
            const arrive = at + MOVE;
            const caretEl = carets[index];

            /* The cursor moves to the field. The from-state is written
               out absolutely so a seek to any time lands the arrow on the
               row it belongs to. */
            const fromY = index === 0 ? 400 : ROW_TOP + (index - 1) * ROW_H + 56;
            tl.fromTo(
              cursor,
              { x: 1808, y: fromY },
              Object.assign(
                { x: 1808, y: rowTop + 56, duration: MOVE, ease: "power2.inOut" },
                LATER
              ),
              at
            );

            /* The press: the cursor dips and releases, the way a click
               reads. It is the same beat the ripple fires on. */
            tl.fromTo(
              cursor,
              { scale: 1 },
              Object.assign({ scale: 0.86, duration: 4 * F, ease: "power2.in" }, LATER),
              arrive
            );
            tl.fromTo(
              cursor,
              { scale: 0.86 },
              Object.assign({ scale: 1, duration: 8 * F, ease: "power2.out" }, LATER),
              arrive + 4 * F
            );

            /* The field springs to full size as the cursor arrives —
               the collapsed 0.86 state is baked into the CSS, so the
               from-state here is explicit and correct at t=0. */
            tl.fromTo(
              row,
              { scale: 0.86 },
              { scale: 1, duration: 10 * F, ease: "back.out(1.6)" },
              arrive
            );

            /* The click ripple: a ring expanding from the click point,
               held at scale 0 and opacity 0 until the press. */
            ripples
              .filter((rp) => rp.row === index)
              .forEach((rp, k) => {
                const delay = k * 4 * F;
                const dur = (k === 0 ? 22 : 28) * F;
                const scale = k === 0 ? 2.0 : 2.4;
                tl.fromTo(
                  rp.el,
                  { opacity: 0, scale: 0 },
                  { opacity: k === 0 ? 0.6 : 0.34, scale: scale, duration: dur, ease: "power2.out" },
                  arrive + delay
                );
                tl.fromTo(
                  rp.el,
                  { opacity: k === 0 ? 0.6 : 0.34 },
                  Object.assign({ opacity: 0, duration: 16 * F, ease: "power1.in" }, LATER),
                  arrive + delay + dur * 0.62
                );
              });

            /* The caret stands in the field while the number counts up,
               blinking as it goes, and lifts out when the figure has
               moved on. */
            tl.fromTo(
              caretEl,
              { opacity: 0 },
              {
                keyframes: [
                  { opacity: 1, duration: 2 * F },
                  { opacity: 1, duration: 7 * F },
                  { opacity: 0, duration: 3 * F },
                  { opacity: 1, duration: 6 * F },
                  { opacity: 0, duration: 4 * F },
                  { opacity: 1, duration: 8 * F },
                  { opacity: 0, duration: 5 * F }
                ],
                ease: "none"
              },
              arrive
            );

            /* The mark counts up into the field. */
            tl.fromTo(
              row,
              { textContent: "0" },
              Object.assign({ textContent: mark.value, duration: CLIMB, ease: "power1.out" }, whole),
              at + COUNT
            );

            /* The achieved figure climbs to the new total. */
            tl.fromTo(
              figure,
              { textContent: prevTotal },
              Object.assign(
                { textContent: mark.total, duration: CLIMB, ease: "power1.out" },
                cents,
                index === 0 ? {} : LATER
              ),
              at + COUNT
            );

            /* The figure takes the weight of the new number: a short
               bump out of the band, anchored on its right edge so the
               number never drifts off its own margin. */
            tl.fromTo(
              figure,
              { scale: 1 },
              Object.assign(
                { scale: 1.06, duration: 5 * F, ease: "power2.out" },
                index === 0 ? {} : LATER
              ),
              at + COUNT
            );
            tl.fromTo(
              figure,
              { scale: 1.06 },
              Object.assign({ scale: 1, duration: 14 * F, ease: "power2.out" }, LATER),
              at + COUNT + 5 * F
            );

            /* The progress rule under the band fills as the figure
               climbs — a scaleX on a full-width fill, never a width
               tween. At 97.00 it stands full. */
            const pct = parseFloat(mark.total) / 97;
            tl.fromTo(
              fill,
              { scaleX: prevFill },
              Object.assign(
                { scaleX: pct, duration: CLIMB, ease: "power1.out" },
                index === 0 ? {} : LATER
              ),
              at + COUNT
            );

            /* The marks still needed in the Final fall as the total
               rises. The new number drops into place, and it only ever
               shows a figure the site itself states. */
            tl.fromTo(
              required,
              { textContent: String(prevRequired), y: index === 0 ? 0 : -12 },
              Object.assign(
                { textContent: String(mark.required), y: 0, duration: CLIMB, ease: "power1.out" },
                requiredSnap,
                index === 0 ? {} : LATER
              ),
              at + COUNT
            );

            prevTotal = mark.total;
            prevRequired = mark.required;
            prevFill = pct;
          });

          /* ----------------------------------------------------------------
             The burst. The final total lands — 97.00 — and twenty-eight
             chips scatter from behind the big figure. Each chip is its
             own fromTo on x, y and rotation with a power2.out fall, so a
             seek into the middle of the burst renders the real mid-flight
             state; a second tween carries the opacity tail so every chip
             ends invisible.
             ---------------------------------------------------------------- */
          const BURST_AT = START + 5 * STEP + COUNT + CLIMB * 0.5;
          particles.forEach((p, i) => {
            const dur = (26 + prand(i * 19 + 7) * 14) * F;
            tl.fromTo(
              p.el,
              { x: p.x, y: p.y, rotation: 0 },
              { x: p.x + p.dx, y: p.y + p.dy, rotation: p.spin, duration: dur, ease: "power2.out" },
              BURST_AT + prand(i * 23 + 8) * 3 * F
            );
            tl.fromTo(
              p.el,
              { opacity: 0 },
              { opacity: 0.9, duration: 3 * F, ease: "power2.out" },
              BURST_AT + prand(i * 23 + 8) * 3 * F
            );
            tl.fromTo(
              p.el,
              { opacity: 0.9 },
              Object.assign(
                { opacity: 0, duration: dur * 0.55, ease: "power1.in" },
                LATER
              ),
              BURST_AT + prand(i * 23 + 8) * 3 * F + dur * 0.35
            );
          });

          window.__timelines = window.__timelines || {};
          window.__timelines["03-six-fields"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
